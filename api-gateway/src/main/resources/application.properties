spring.application.name=API-GATEWAY
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].id=user
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/admin/**,/api/student/**,/api/staff/**,/api/branches/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].id=mentor
spring.cloud.gateway.server.webflux.routes[2].uri=lb://MENTOR-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/mentor/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1


# Allow React development frontend
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Task service
spring.cloud.gateway.server.webflux.routes[3].id=task
spring.cloud.gateway.server.webflux.routes[3].uri=lb://TASK-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/tasks/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
# Meeting service
spring.cloud.gateway.server.webflux.routes[4].id=meeting
spring.cloud.gateway.server.webflux.routes[4].uri=lb://MEETING-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/meetings/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
